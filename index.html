<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Цвета берутся из темы Telegram, поэтому приложение само становится светлым или тёмным */
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #eef1f4);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #16202a);
    --hint: var(--tg-theme-hint-color, #7d8b99);
    --accent: var(--tg-theme-button-color, #2f7de1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: var(--tg-theme-destructive-text-color, #d9463b);
    --coin: #e9b23a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.tg) {
      --bg: #12171d; --card: #1c232b; --text: #e8edf2; --hint: #8a97a5;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: Manrope, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    max-width: 560px; margin: 0 auto; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; border: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .total { padding: 8px 4px 22px; }
  .total p { margin: 0; color: var(--hint); font-size: 15px; }
  .total h1 { margin: 2px 0 0; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }

  .goal {
    display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center;
    background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 10px;
    width: 100%; text-align: left; color: var(--text);
  }
  .jar { width: 56px; height: 68px; }
  .goal h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .goal .sum { font-size: 15px; }
  .goal .left { font-size: 13px; color: var(--hint); margin-top: 2px; }
  .done { color: var(--coin); font-weight: 600; }

  .empty { text-align: center; color: var(--hint); padding: 48px 20px; line-height: 1.5; }

  .add {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: 528px; margin: 0 auto; padding: 16px; border-radius: 14px;
    background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 16px;
  }

  /* Нижняя шторка с формами */
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; }
  .shade.open { display: flex; }
  .sheet {
    background: var(--card); width: 100%; max-width: 560px; margin: 0 auto;
    border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: 85vh; overflow-y: auto; animation: up .2s ease-out;
  }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet h3 { margin: 0 0 14px; font-size: 20px; overflow-wrap: anywhere; }
  .sheet label { display: block; font-size: 14px; color: var(--hint); margin: 10px 0 6px; }
  .sheet input {
    width: 100%; padding: 14px; font: inherit; font-size: 18px; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--hint) 40%, transparent);
    background: var(--bg); color: var(--text);
  }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 6px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; padding: 14px; border-radius: 12px; font-weight: 600; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .secondary { background: var(--bg); color: var(--text); }
  .ghost { background: none; color: var(--danger); width: 100%; padding: 14px; margin-top: 6px; }

  .big-jar { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .big-jar svg { width: 80px; height: 98px; flex: none; }
  .big-jar .sum { font-size: 22px; font-weight: 800; }
  .history { list-style: none; padding: 0; margin: 16px 0 0; }
  .history li { display: flex; justify-content: space-between; padding: 10px 0; font-size: 15px;
    border-top: 1px solid color-mix(in srgb, var(--hint) 20%, transparent); }
  .history .d { color: var(--hint); font-size: 13px; }
  .plus { color: #2e9e5b; } .minus { color: var(--danger); }
</style>
</head>
<body>
<section class="total">
  <p>Всего накоплено</p>
  <h1 id="total">0 ₽</h1>
</section>
<div id="list"></div>
<button class="add" id="addBtn">Новая цель</button>

<div class="shade" id="shade"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
if (inTelegram) { tg.ready(); tg.expand(); document.documentElement.classList.add("tg"); }

// ---------- Хранилище ----------
// В Telegram данные хранятся в облаке Telegram (CloudStorage), отдельно у каждого пользователя.
// Вне Telegram (для проверки в браузере) — в памяти браузера.
const useCloud = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9");
const store = {
  get(k) {
    if (!useCloud) { try { return Promise.resolve(localStorage.getItem(k)); } catch { return Promise.resolve(null); } }
    return new Promise((res, rej) => tg.CloudStorage.getItem(k, (e, v) => e ? rej(e) : res(v || null)));
  },
  set(k, v) {
    if (!useCloud) { try { localStorage.setItem(k, v); } catch {} return Promise.resolve(); }
    return new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e) => e ? rej(e) : res()));
  },
  remove(k) {
    if (!useCloud) { try { localStorage.removeItem(k); } catch {} return Promise.resolve(); }
    return new Promise((res, rej) => tg.CloudStorage.removeItem(k, (e) => e ? rej(e) : res()));
  }
};

let ids = [];          // порядок целей
const goals = {};      // id -> {name, target, balance, ops:[[сумма, время], ...]}
const MAX_OPS = 40;    // храним последние 40 операций, чтобы уложиться в лимит 4096 символов

async function load() {
  try {
    ids = JSON.parse(await store.get("ids") || "[]");
    for (const id of ids) {
      const raw = await store.get("g_" + id);
      if (raw) goals[id] = JSON.parse(raw);
    }
    ids = ids.filter(id => goals[id]);
  } catch (e) { alertMsg("Не удалось загрузить данные. Закройте и откройте приложение ещё раз."); }
  render();
}
async function saveGoal(id) { await store.set("g_" + id, JSON.stringify(goals[id])); }
async function saveIds() { await store.set("ids", JSON.stringify(ids)); }

// ---------- Помощники ----------
function parseAmount(t) {
  const v = Number(String(t).replace(/\s/g, "").replace(",", "."));
  if (!isFinite(v) || v <= 0 || v > 1e9) return null;
  return Math.round(v * 100);           // в копейках
}
function money(k) {
  return (k / 100).toLocaleString("ru-RU", { minimumFractionDigits: k % 100 ? 2 : 0, maximumFractionDigits: 2 }) + " ₽";
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function pct(g) { return g.target ? Math.min(g.balance / g.target, 1) : 0; }
function haptic(type) { if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); }
function alertMsg(t) { inTelegram && tg.showAlert ? tg.showAlert(t) : alert(t); }
function confirmMsg(t) {
  return new Promise(res => inTelegram && tg.showConfirm ? tg.showConfirm(t, res) : res(confirm(t)));
}

// Банка, которая наполняется монетами по мере накопления
function jar(p) {
  const h = 52 * p, y = 62 - h;
  return `<svg viewBox="0 0 56 68" aria-hidden="true">
    <rect x="16" y="2" width="24" height="6" rx="2" fill="var(--hint)" opacity=".5"/>
    <rect x="6" y="${y}" width="44" height="${h}" rx="${p > .9 ? 10 : 3}" fill="var(--coin)"/>
    <path d="M14 8 h28 v4 q8 4 8 12 v34 q0 8 -8 8 h-28 q-8 0 -8 -8 v-34 q0 -8 8 -12z"
      fill="none" stroke="var(--hint)" stroke-width="2.5" opacity=".7"/>
    <text x="28" y="44" text-anchor="middle" font-size="13" font-weight="800"
      fill="var(--text)">${Math.round(p * 100)}%</text>
  </svg>`;
}

// ---------- Отрисовка ----------
function render() {
  const total = ids.reduce((s, id) => s + goals[id].balance, 0);
  document.getElementById("total").textContent = money(total);
  const list = document.getElementById("list");
  if (!ids.length) {
    list.innerHTML = `<div class="empty">Целей пока нет.<br>Нажмите «Новая цель» и укажите, сколько хотите накопить.</div>`;
    return;
  }
  list.innerHTML = ids.map(id => {
    const g = goals[id], left = Math.max(g.target - g.balance, 0);
    return `<button class="goal" data-id="${id}">
      <div class="jar">${jar(pct(g))}</div>
      <div><h2>${esc(g.name)}</h2>
        <div class="sum">${money(g.balance)} из ${money(g.target)}</div>
        <div class="left">${left ? "Осталось " + money(left) : '<span class="done">Цель достигнута</span>'}</div>
      </div></button>`;
  }).join("");
  list.querySelectorAll(".goal").forEach(b => b.onclick = () => openGoal(b.dataset.id));
}

const shade = document.getElementById("shade"), sheet = document.getElementById("sheet");
function openSheet(html) { sheet.innerHTML = html; shade.classList.add("open"); const i = sheet.querySelector("input"); if (i) setTimeout(() => i.focus(), 50); }
function closeSheet() { shade.classList.remove("open"); }
shade.onclick = e => { if (e.target === shade) closeSheet(); };

// ---------- Новая цель ----------
document.getElementById("addBtn").onclick = () => {
  openSheet(`<h3>Новая цель</h3>
    <label for="n">На что копим</label><input id="n" maxlength="40" placeholder="Например, ноутбук">
    <label for="t">Сколько нужно, ₽</label><input id="t" inputmode="decimal" placeholder="80 000">
    <div class="error" id="err"></div>
    <div class="row"><button class="secondary" id="cancel">Отмена</button><button class="primary" id="ok">Создать цель</button></div>`);
  sheet.querySelector("#cancel").onclick = closeSheet;
  sheet.querySelector("#ok").onclick = async () => {
    const name = sheet.querySelector("#n").value.trim();
    const target = parseAmount(sheet.querySelector("#t").value);
    const err = sheet.querySelector("#err");
    if (!name) { err.textContent = "Введите название цели."; return; }
    if (!target) { err.textContent = "Введите сумму числом, например 80000."; return; }
    if (ids.length >= 100) { err.textContent = "Можно создать не больше 100 целей."; return; }
    const id = Date.now().toString(36);
    goals[id] = { name, target, balance: 0, ops: [] };
    ids.push(id);
    try { await saveGoal(id); await saveIds(); } catch { err.textContent = "Не удалось сохранить. Проверьте интернет."; return; }
    haptic("success"); closeSheet(); render();
  };
};

// ---------- Экран цели ----------
function openGoal(id) {
  const g = goals[id], left = Math.max(g.target - g.balance, 0);
  const hist = g.ops.length
    ? `<ul class="history">${g.ops.slice().reverse().map(([a, t]) =>
        `<li><span class="${a > 0 ? "plus" : "minus"}">${a > 0 ? "+" : "−"} ${money(Math.abs(a))}</span>
         <span class="d">${new Date(t).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span></li>`).join("")}</ul>`
    : `<p class="left" style="color:var(--hint)">Операций пока нет.</p>`;
  openSheet(`<div class="big-jar">${jar(pct(g))}<div><h3 style="margin:0 0 4px">${esc(g.name)}</h3>
      <div class="sum">${money(g.balance)}</div>
      <div style="color:var(--hint);font-size:14px">из ${money(g.target)}${left ? ", осталось " + money(left) : ""}</div></div></div>
    <label for="a">Сумма, ₽</label><input id="a" inputmode="decimal" placeholder="5 000">
    <div class="error" id="err"></div>
    <div class="row"><button class="secondary" id="wd">Снять</button><button class="primary" id="dep">Пополнить</button></div>
    ${hist}
    <button class="ghost" id="del">Удалить цель</button>`);
  sheet.querySelector("#dep").onclick = () => operate(id, 1);
  sheet.querySelector("#wd").onclick = () => operate(id, -1);
  sheet.querySelector("#del").onclick = async () => {
    if (!(await confirmMsg(`Удалить цель «${g.name}» и всю её историю?`))) return;
    ids = ids.filter(x => x !== id); delete goals[id];
    try { await saveIds(); await store.remove("g_" + id); } catch {}
    haptic("warning"); closeSheet(); render();
  };
}

async function operate(id, sign) {
  const g = goals[id], err = sheet.querySelector("#err");
  const a = parseAmount(sheet.querySelector("#a").value);
  if (!a) { err.textContent = "Введите сумму больше нуля."; return; }
  if (sign < 0 && a > g.balance) { err.textContent = "Нельзя снять больше, чем накоплено: " + money(g.balance) + "."; return; }
  g.balance += sign * a;
  g.ops.push([sign * a, Date.now()]);
  if (g.ops.length > MAX_OPS) g.ops = g.ops.slice(-MAX_OPS);
  try { await saveGoal(id); } catch { g.balance -= sign * a; g.ops.pop(); err.textContent = "Не удалось сохранить. Проверьте интернет."; return; }
  haptic("success"); render(); openGoal(id);
}

load();
</script>
</body>
</html>
