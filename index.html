<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Копилка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== Цвета в стиле iOS: светлая и тёмная тема ===== */
:root {
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000;
  --sec:rgba(60,60,67,.64); --ter:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12); --track:rgba(118,118,128,.16); --seg-on:#FFFFFF;
  --accent:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  /* Яркие зелёный и оранжевый плохо читаются мелким текстом на белом, для надписей — тёмные оттенки */
  --green-t:#248A3D; --orange-t:#C93400; --red-t:#D70015;
  --tint:rgba(0,122,255,.12);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg:#000000; --card:#1C1C1E; --text:#FFFFFF;
  --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --fill:rgba(118,118,128,.24); --track:rgba(118,118,128,.3); --seg-on:#636366;
  --accent:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
  --green-t:#30D158; --orange-t:#FF9F0A; --red-t:#FF453A;
  --tint:rgba(10,132,255,.18);
  color-scheme: dark;
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); }
/* Запрет масштабирования: страницу нельзя увеличить двумя пальцами или двойным нажатием,
   прокрутка при этом работает как обычно */
html { touch-action:pan-x pan-y; overflow-x:hidden; }
body { overflow-x:hidden; }
body {
  /* Системный шрифт: San Francisco на iPhone, Roboto на Android. Ничего не скачивается из интернета. */
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", sans-serif;
  -webkit-text-size-adjust:100%;
  font-size:17px; line-height:1.3; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input { font:inherit; color:var(--text); }
button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
.num { font-variant-numeric:tabular-nums; }

.page { max-width:600px; margin:0 auto; padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px)); }
.large-title { font-size:34px; font-weight:700; letter-spacing:.01em; margin:8px 0 12px; }
.hero-total { margin:0 0 4px; font-size:15px; color:var(--sec); }
/* Шапка главного экрана: своя для каждой вкладки */
.summary { margin:0 0 18px; }
.summary .cap { font-size:15px; color:var(--sec); }
.summary .total { font-size:30px; font-weight:700; letter-spacing:-.02em; margin-top:1px; }
.summary .hint { font-size:15px; color:var(--sec); margin-top:4px; }
.bar { height:4px; border-radius:2px; background:var(--track); margin-top:12px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:2px; background:var(--accent); transition:width .5s cubic-bezier(.2,.8,.2,1); }
.bar i.full { background:var(--green); }
@media (prefers-reduced-motion:reduce) { .bar i { transition:none; } }
/* Серые заглушки, пока данные загружаются */
.skeleton { border-radius:12px; background:var(--fill); margin-bottom:10px; animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.55; } }
@media (prefers-reduced-motion:reduce) { .skeleton { animation:none; } }
.hero-total b { display:block; color:var(--text); font-size:28px; font-weight:600; letter-spacing:-.01em; }
.hero-hint { font-size:15px; color:var(--sec); margin:6px 0 16px; }

/* Сегментированный переключатель */
.seg { display:flex; background:var(--fill); border-radius:9px; padding:2px; margin:0 0 20px; }
.seg button { flex:1; padding:7px 4px; border-radius:7px; font-size:13px; font-weight:500; }
.seg button.on { background:var(--seg-on); box-shadow:0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight:600; }

/* Сгруппированные списки как в Настройках iOS */
.group-title { font-size:13px; color:var(--sec); padding:0 16px 7px; }
.group { background:var(--card); border-radius:12px; overflow:hidden; margin:0 0 28px; }
.group-foot { font-size:13px; color:var(--sec); padding:0 16px; margin:-20px 0 28px; line-height:1.4; }
.cell { display:flex; align-items:center; gap:12px; padding:11px 16px; min-height:44px; position:relative; width:100%; text-align:left; }
.cell + .cell::before { content:""; position:absolute; top:0; right:0; left:16px; height:1px; transform:scaleY(.5); background:var(--sep); }
.goal-cell + .goal-cell::before { left:76px; }
.cell .grow { flex:1; min-width:0; }
.cell .val { color:var(--sec); text-align:right; }
.chev { color:var(--ter); font-size:20px; line-height:1; }
.name { font-weight:600; overflow-wrap:anywhere; }
.sub { font-size:15px; color:var(--sec); margin-top:2px; }

/* Кольцо прогресса */
.ring-wrap { position:relative; flex:none; display:grid; place-items:center; }
.ring-wrap .inner { position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.ring circle.p { transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
@media (prefers-reduced-motion:reduce) { .ring circle.p { transition:none; } }

.empty { text-align:center; padding:40px 24px; color:var(--sec); }
.empty .name { color:var(--text); font-size:20px; margin:16px 0 6px; }
.empty .ring-wrap { margin:0 auto; }

/* Кнопки */
.btn { display:block; width:100%; min-height:50px; border-radius:12px; font-size:17px; font-weight:600; }
.btn:active { opacity:.7; }
button.cell:active, .bill-cell .open:active { background:var(--fill); }
.nav button:active { opacity:.5; }
.btn.primary { background:var(--accent); color:#fff; }
.fab { box-shadow:0 6px 20px rgba(0,122,255,.28); }
.btn.tinted { background:var(--tint); color:var(--accent); }
.btn.danger { color:var(--red-t); background:var(--card); }
.btn-row { display:flex; gap:10px; }
.btn-row .btn { flex:1; }
.fab { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:568px; margin:0 auto; width:auto; }
.link { color:var(--accent); }

/* Шторка */
.sheet-wrap { position:fixed; inset:0; background:rgba(0,0,0,.32); display:none; z-index:10; }
.sheet-wrap.open { display:block; }
.sheet {
  position:absolute; left:0; right:0; bottom:0; top:max(20px, env(safe-area-inset-top,0px));
  background:var(--bg); border-radius:14px 14px 0 0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  animation:rise .32s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise { from { transform:translateY(40px); opacity:.4; } }
@media (prefers-reduced-motion:reduce) { .sheet { animation:none; } }
.sheet-in { max-width:600px; margin:0 auto; padding:0 16px calc(40px + env(safe-area-inset-bottom,0px)); }
.grabber { width:36px; height:5px; border-radius:3px; background:var(--ter); margin:6px auto 0; }
.nav { display:flex; align-items:center; justify-content:space-between; height:48px; position:sticky; top:0; background:var(--bg); z-index:2; }
.nav .t { flex:1; min-width:0; text-align:center; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav button { color:var(--accent); padding:8px 0; min-width:84px; min-height:44px; }
.nav button:first-child { text-align:left; } .nav button:last-child { text-align:right; }
.nav button.bold { font-weight:600; }

.detail-hero { display:flex; flex-direction:column; align-items:center; text-align:center; padding:8px 0 24px; }
.detail-hero h2 { margin:14px 0 4px; font-size:24px; font-weight:700; overflow-wrap:anywhere; }
.detail-hero .big { font-size:15px; color:var(--sec); margin-top:1px; }
.detail-hero .amount-big { font-size:28px; font-weight:700; letter-spacing:-.02em; color:var(--text); margin-top:14px; }
.pct { font-size:28px; font-weight:700; letter-spacing:-.02em; }
.pct-small { font-size:11px; font-weight:600; color:var(--sec); }

/* Поля ввода */
.amount { width:100%; border:0; background:transparent; font-size:34px; font-weight:600; text-align:center; padding:14px 0 6px; outline:none; }
.amount::placeholder { color:var(--ter); }
.chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:4px 16px 14px; }
.chip { min-height:36px; padding:7px 14px; border-radius:18px; background:var(--fill); font-size:15px; font-weight:500; }
.chip:active { background:var(--tint); }
.cell input.right { flex:1; min-width:0; border:0; background:transparent; text-align:right; outline:none; padding:0; }
.cell input.right::placeholder { color:var(--ter); }
.cell input[type="date"] { flex:none; border:0; background:var(--fill); border-radius:8px; padding:6px 10px; outline:none; }
.err { color:var(--red-t); font-size:15px; min-height:20px; text-align:center; padding:0 16px 10px; }
.emoji-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; padding:12px; }
.emoji-grid button { font-size:26px; height:48px; border-radius:10px; }
.emoji-grid button.on { background:var(--tint); box-shadow:inset 0 0 0 2px var(--accent); }
.preview { padding:14px 16px; font-size:15px; line-height:1.4; }
.preview b { font-size:20px; display:block; margin-bottom:2px; }

/* Переключатель как в iOS */
.switch { position:relative; width:51px; height:31px; flex:none; }
.switch input { opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1; }
.switch span { position:absolute; inset:0; background:var(--track); border-radius:16px; transition:background .2s; }
.switch span::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); transition:transform .2s; }
.switch input:checked + span { background:var(--green); }
.switch input:checked + span::after { transform:translateX(20px); }

.insight { padding:14px 16px; font-size:15px; line-height:1.45; }

/* Достижения */
.badges { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:16px 8px 12px; }
.badge { text-align:center; padding:4px 2px; }
.badge .e { font-size:28px; width:54px; height:54px; margin:0 auto 6px; border-radius:50%; display:grid; place-items:center; background:var(--tint); }
.badge.off .e { background:var(--fill); filter:grayscale(1); opacity:.35; }
.badge .t { font-size:11px; line-height:1.2; font-weight:500; }
.badge.off .t { color:var(--ter); }
.streak { font-size:13px; font-weight:600; color:var(--orange-t); white-space:nowrap; }

/* Обязательные траты: кружок отметки как в «Напоминаниях» */
/* Сам кружок 26px, но область нажатия 44px — по нему легко попасть пальцем */
.check { width:44px; height:44px; margin:-9px -6px -9px -9px; flex:none; display:grid; place-items:center; }
.check i { width:26px; height:26px; border-radius:50%; border:2px solid var(--ter); display:grid; place-items:center;
  color:#fff; font-size:14px; font-weight:700; font-style:normal; transition:background .15s, border-color .15s; }
.check.on i { background:var(--green); border-color:var(--green); }
.bill-cell .open { flex:1; min-width:0; display:flex; align-items:center; gap:10px; text-align:left; }
.bill-cell .em { font-size:22px; width:28px; text-align:center; flex:none; }
.bill-cell.paid .name, .bill-cell.paid .amt { color:var(--sec); }
.amt { font-weight:600; white-space:nowrap; }
.sum-card { display:flex; align-items:center; gap:16px; padding:16px; }
.sum-card .big { font-size:22px; font-weight:700; letter-spacing:-.01em; }
.days { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; padding:8px 10px 10px; justify-items:center; }
.days button { width:42px; height:42px; border-radius:50%; font-size:16px; font-variant-numeric:tabular-nums; }
.days button.on { background:var(--accent); color:#fff; font-weight:600; }

/* Всплывающее поздравление */
:root { --hud:rgba(255,255,255,.88); }
:root[data-theme="dark"] { --hud:rgba(44,44,46,.9); }
.toast {
  position:fixed; left:50%; top:42%; z-index:30; pointer-events:none; opacity:0;
  transform:translate(-50%,-50%) scale(.9); transition:opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1);
  background:var(--hud); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border-radius:22px; padding:22px 28px; text-align:center; min-width:210px; max-width:80vw;
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}
.toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
.toast .e { font-size:52px; line-height:1; }
.toast .t { font-weight:700; font-size:18px; margin-top:10px; }
.toast .s { font-size:14px; color:var(--sec); margin-top:3px; }
/* Полоска внизу после операции, с кнопкой «Отменить» */
:root { --bar:#1C1C1E; } :root[data-theme="dark"] { --bar:#3A3A3C; }
.snack {
  position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:31; max-width:576px; margin:0 auto;
  display:flex; align-items:center; gap:12px; background:var(--bar); color:#fff; border-radius:14px; padding:6px 6px 6px 16px; min-height:52px;
  font-size:15px; box-shadow:0 8px 28px rgba(0,0,0,.28); opacity:0; transform:translateY(16px); pointer-events:none;
  transition:opacity .2s, transform .25s cubic-bezier(.2,.8,.2,1);
}
.snack.show { opacity:1; transform:none; pointer-events:auto; }
.snack span { flex:1; min-width:0; }
.snack button { color:#64B5FF; font-weight:600; min-height:40px; padding:0 12px; }
@media (prefers-reduced-motion:reduce) { .snack { transition:opacity .2s; transform:none; } }

@media (prefers-reduced-motion:reduce) { .toast { transition:opacity .2s; transform:translate(-50%,-50%); } }
/* Цвета состояний стоят последними: так «Оплатить сегодня» или «+1 200 ₽» окрашиваются даже внутри серых подписей */
.ok, .cell .val.ok { color:var(--green-t); }
.warn, .cell .val.warn { color:var(--orange-t); }
.bad, .cell .val.bad { color:var(--red-t); }
body.locked { overflow:hidden; }
.sheet { overscroll-behavior:contain; outline:none; }
</style>
</head>
<body>
<main class="page" id="app"></main>
<div class="sheet-wrap" id="wrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>

<script>
/* ================== Telegram и тема ================== */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
const ver = v => inTG && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
function applyTheme() {
  const dark = inTG ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (ver("6.9")) { try { const c = dark ? "#000000" : "#F2F2F7"; tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {} }
}
if (inTG) {
  tg.ready(); tg.expand(); tg.onEvent("themeChanged", applyTheme);
  if (ver("7.7")) { try { tg.disableVerticalSwipes(); } catch (e) {} }
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.stack.length) back(); });
// В браузере iPhone жест увеличения двумя пальцами отменяется только так
["gesturestart", "gesturechange"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
applyTheme();
const haptic = t => { if (inTG && tg.HapticFeedback) { t === "tap" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.notificationOccurred(t); } };
const alertMsg = t => (inTG && tg.showAlert ? tg.showAlert(t) : alert(t));
const confirmMsg = t => new Promise(r => (inTG && tg.showConfirm ? tg.showConfirm(t, r) : r(confirm(t))));

/* ================== Хранилище: облако Telegram ================== */
const useCloud = ver("6.9");
const store = {
  get(k) {
    if (!useCloud) { try { return Promise.resolve(localStorage.getItem(k)); } catch (e) { return Promise.resolve(null); } }
    return new Promise((res, rej) => tg.CloudStorage.getItem(k, (e, v) => (e ? rej(e) : res(v || null))));
  },
  set(k, v) {
    if (!useCloud) { try { localStorage.setItem(k, v); return Promise.resolve(); } catch (e) { return Promise.reject(e); } }
    return new Promise((res, rej) => tg.CloudStorage.setItem(k, v, e => (e ? rej(e) : res())));
  },
  remove(k) {
    if (!useCloud) { try { localStorage.removeItem(k); } catch (e) {} return Promise.resolve(); }
    return new Promise((res, rej) => tg.CloudStorage.removeItem(k, e => (e ? rej(e) : res())));
  }
};

/* ================== Расчёты (все суммы в копейках) ================== */
const DAY = 864e5;
const MAX_OPS = 40;
function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function parseDate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function toISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

// Дата через k периодов (недель или месяцев). Для месяцев 31-е число превращается в последний день короткого месяца.
function addPeriod(d, k, freq) {
  if (freq === "week") return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7 * k);
  const y = d.getFullYear(), m = d.getMonth() + k;
  const dim = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(d.getDate(), dim));
}
// Сколько полных периодов помещается между датами
function periodsBetween(a, b, freq) {
  if (b <= a) return 0;
  if (freq === "week") return Math.floor(Math.round((b - a) / DAY) / 7);
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  return Math.max(m, 0);
}
// Ставка за один период: годовая ставка / 12 (или / 52 для недель), проценты капитализируются каждый период
function perRate(g) { return (g.rate || 0) / 100 / (g.freq === "week" ? 52 : 12); }

// Сколько платежей осталось до срока. null — срока нет, -1 — срок прошёл
function paymentsLeft(g) {
  if (!g.deadline) return null;
  const t = today0(), d = parseDate(g.deadline);
  if (d < t) return -1;
  return Math.max(periodsBetween(t, d, g.freq), 1);
}

/* Регулярный платёж P, чтобы за n периодов из B получить T.
   Без процентов:  P = (T − B) / n
   С процентами r: T = B·(1+r)^n + P·((1+r)^n − 1) / r  ⇒  P = (T − B·(1+r)^n) · r / ((1+r)^n − 1)
   Платёж округляется вверх до целого рубля, чтобы точно хватило. */
function needPayment(B, T, n, r) {
  if (T <= B) return 0;
  if (n <= 0) return T - B;
  if (!r) return Math.ceil((T - B) / n / 100) * 100;
  const q = Math.pow(1 + r, n);
  const p = (T - B * q) * r / (q - 1);
  return p <= 0 ? 0 : Math.ceil(p / 100) * 100;
}

/* Обратная задача: за сколько периодов накопим T, если вносить P.
   Без процентов: n = (T − B) / P
   С процентами:  (1+r)^n = (T·r + P) / (B·r + P)  ⇒  n = ln(...) / ln(1+r) */
function periodsToFinish(B, T, P, r) {
  if (T <= B) return 0;
  if (P <= 0) return null;
  if (!r) return Math.ceil((T - B) / P);
  return Math.ceil(Math.log((T * r + P) / (B * r + P)) / Math.log(1 + r));
}

// График: дата каждого платежа и сумма на счёте после него
function schedule(g) {
  const n = paymentsLeft(g);
  if (!n || n < 1) return [];
  const r = perRate(g), p = needPayment(g.balance, g.target, n, r);
  const t = today0(), dl = parseDate(g.deadline);
  let bal = g.balance;
  const rows = [];
  for (let k = 1; k <= n; k++) {
    bal = bal * (1 + r) + p;
    const d = addPeriod(t, k, g.freq);
    rows.push({ date: d > dl ? dl : d, pay: p, bal: Math.round(bal) });
  }
  return rows;
}

// План фиксируется при создании цели или изменении срока; по нему видно, опережаете вы или отстаёте
function makePlan(g) {
  const n = paymentsLeft(g);
  g.plan = n > 0 ? { start: today0().getTime(), sb: g.balance, pmt: needPayment(g.balance, g.target, n, perRate(g)), n, r: perRate(g), freq: g.freq } : null;
}
function planStatus(g) {
  const pl = g.plan;
  if (!pl || !g.deadline) return null;
  const k = Math.min(periodsBetween(new Date(pl.start), today0(), pl.freq), pl.n);
  const q = Math.pow(1 + pl.r, k);
  let expected = pl.r ? pl.sb * q + pl.pmt * (q - 1) / pl.r : pl.sb + pl.pmt * k;
  expected = Math.min(Math.round(expected), g.target);
  return { diff: g.balance - expected, expected };
}

// Средний темп пополнений за последние 90 дней, ₽ в месяц
function monthlyPace(g) {
  const since = Date.now() - 90 * DAY;
  const ops = g.ops.filter(o => o[1] >= since);
  if (ops.length < 2) return null;
  const net = ops.reduce((s, o) => s + o[0], 0);
  if (net <= 0) return null;
  const first = Math.min(...ops.map(o => o[1]));
  const days = Math.max((Date.now() - first) / DAY, 30);
  return net / days * 30.44;
}

}

/* ----- Серия пополнений без пропусков -----
   Номер периода: для месяцев — год·12 + месяц, для недель — номер недели (с понедельника). */
function periodIdx(ts, freq) {
  const d = new Date(ts);
  if (freq === "week") {
    const days = Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
    return Math.floor((days + 3) / 7);           // 1 января 1970 — четверг, сдвиг на 3 дня делает границей понедельник
  }
  return d.getFullYear() * 12 + d.getMonth();
}
function addToStreak(g, ts) {
  const i = periodIdx(ts, g.freq);
  if (g.lastP === i) return;                      // в этом периоде уже пополняли
  g.streak = g.lastP === i - 1 ? g.streak + 1 : 1; // предыдущий период был — серия растёт, иначе начинается заново
  g.lastP = i;
  g.best = Math.max(g.best || 0, g.streak);
}
function rebuildStreak(g) {
  const best = g.best || 0;
  g.streak = 0; g.lastP = null; g.best = 0;
  g.ops.filter(o => o[0] > 0).sort((a, b) => a[1] - b[1]).forEach(o => addToStreak(g, o[1]));
  g.best = Math.max(best, g.best);
}
// Текущая серия: не прерывается, пока не закончился следующий за последним пополнением период
function curStreak(g) {
  if (g.lastP == null) return 0;
  return g.lastP >= periodIdx(Date.now(), g.freq) - 1 ? g.streak : 0;
}

    for (const id of S.ids) {

    <button class="btn primary fab" data-act="newBill">Новая трата</button>`;
  return h;
}
async function togglePaid(id) {
  const b = BL.items[id], mk = monthKey(today0());
  b.paid = b.paid || {};
  const wasPaid = !!b.paid[mk];
  if (wasPaid) delete b.paid[mk];
  else {
    b.paid[mk] = Date.now();
    const keys = Object.keys(b.paid).sort();          // храним отметки только за последние 12 месяцев
    while (keys.length > 12) delete b.paid[keys.shift()];
  }
  try { await saveBill(id); }
  catch (e) { if (wasPaid) b.paid[mk] = Date.now(); else delete b.paid[mk]; alertMsg("Не удалось сохранить. Проверьте интернет."); return; }
  renderMain();
  if (wasPaid) { haptic("tap"); return; }
  const all = BL.ids.every(x => isPaid(BL.items[x]));
  haptic("success");
  if (all && BL.ids.length > 1) toast("🎉", "Всё оплачено", "Обязательные траты за " + monthName(today0()) + " закрыты");
  else toast("✓", "Оплачено", `${b.name}, ${money(b.amount)}`);
}

const wrap = document.getElementById("wrap"), sheet = document.getElementById("sheet");
function push(kind, id) {

}
function showTop(scrollTop) {
  const top = S.stack[S.stack.length - 1];

    if (ver("6.1")) tg.BackButton.hide();

  sheet.innerHTML = `<div class="grabber"></div><div class="sheet-in">${top.kind === "detail" ? detailHTML(top.id) : top.kind === "bill" ? billFormHTML() : formHTML()}</div>`;
  wrap.classList.add("open");
  document.body.classList.add("locked");          // главный экран под шторкой не прокручивается

  if (ver("6.1")) tg.BackButton.show();
  if (top.kind === "form") updatePreview();

}

// Одна фраза о том, как идут дела у цели
function statusText(g) {
  if (g.balance >= g.target) return `<span class="ok">Цель достигнута. Поздравляем!</span>`;
  const n = paymentsLeft(g), left = g.target - g.balance;
  if (n === -1) return `<span class="bad">Срок прошёл ${dLong(parseDate(g.deadline))}.</span> Осталось накопить ${money(left)}.`;
  if (!n) {
    const pace = monthlyPace(g);
    return pace
      ? `При вашем темпе около ${money(Math.round(pace / 100) * 100)} в месяц цель будет достигнута примерно в ${dInMonth(new Date(Date.now() + (left / pace) * 30.44 * DAY))}.`
      : `Осталось накопить ${money(left)}. Добавьте срок, и копилка рассчитает план.`;
  }
  const pay = needPayment(g.balance, g.target, n, perRate(g)), st = planStatus(g), by = dLong(parseDate(g.deadline));
  if (!pay) return `<span class="ok">Вносить больше не нужно:</span> проценты доведут сумму до цели к ${by}.`;
  if (st && st.diff < -100) return `<span class="warn">Отстаёте от плана на ${money(-st.diff)}.</span> Чтобы успеть к ${by}, вносите ${money(pay)} ${PER[g.freq]}.`;
  if (st && st.diff > 100) return `<span class="ok">Опережаете план на ${money(st.diff)}.</span> Достаточно вносить ${money(pay)} ${PER[g.freq]} до ${by}.`;
  return `Вносите ${money(pay)} ${PER[g.freq]}, и к ${by} цель будет достигнута.`;
}

// Вкладка «Обзор»: пополнение, вывод, достижения
function overviewTab(g) {
  const n = paymentsLeft(g), done = g.balance >= g.target;

  const got = ACH.filter(a => g.ach[a.id]).length, cs = curStreak(g), thisP = g.lastP === periodIdx(Date.now(), g.freq);
  const where = g.freq === "week" ? "на этой неделе" : "в этом месяце";
  const streakTxt = cs > 0

    <div class="cell sub" style="margin:0">${streakTxt}</div>
    ${g.best > 1 ? `<div class="cell"><span class="grow">Лучшая серия</span><span class="val num">${g.best} ${plural(g.best, UNIT_NOM[g.freq])}</span></div>` : ""}</div>`;
  return h;
}

// Вкладка «План»: расчёт, график платежей, «Что если»
function planTab(g) {
  if (g.balance >= g.target) return `<div class="group"><div class="cell"><span class="ok">Цель достигнута, план выполнен.</span></div></div>`;
  const left = g.target - g.balance, n = paymentsLeft(g), r = perRate(g);
  const planPay = n > 0 ? needPayment(g.balance, g.target, n, r) : 0;
  let h = "";
  if (n === -1) {
    h += `<div class="group-title">План</div><div class="group">
      <div class="cell"><span class="grow">Срок</span><span class="val bad">${dLong(parseDate(g.deadline))}</span></div>
      <div class="cell"><span class="grow">Осталось накопить</span><span class="val num">${money(left)}</span></div>
      <button class="cell link" data-act="edit">Назначить новый срок</button></div>`;
  } else if (n) {
    const rows = schedule(g), last = rows[rows.length - 1];
    const interest = r && last ? Math.max(0, last.bal - g.balance - planPay * n) : 0;
    h += `<div class="group-title">План</div><div class="group">
      <div class="cell"><span class="grow">${planPay ? "Вносить" : "Вносить больше не нужно"}</span><span class="val num" style="color:var(--text);font-weight:600">${planPay ? money(planPay) + " " + PER[g.freq] : ""}</span></div>
      <div class="cell"><span class="grow">Срок</span><span class="val">${dLong(parseDate(g.deadline))}</span></div>
      <div class="cell"><span class="grow">Осталось</span><span class="val num">${n} ${plural(n, PAY_WORDS)}</span></div>
      ${g.rate ? `<div class="cell"><span class="grow">Ставка</span><span class="val num">${String(g.rate).replace(".", ",")}% годовых</span></div>
      <div class="cell"><span class="grow">Принесут проценты</span><span class="val num ok">+${money(interest)}</span></div>` : ""}</div>`;
    if (planPay) {
      const shown = S.showAll ? rows : rows.slice(0, 6);
      h += `<div class="group-title">График платежей</div><div class="group">` +
        shown.map(x => `<div class="cell"><span class="grow">${dLong(x.date)}</span>
          <span class="val num" style="line-height:1.25"><span style="color:var(--text)">+${money(x.pay)}</span><br><span style="font-size:13px">итого ${money(x.bal)}</span></span></div>`).join("") +
        (rows.length > 6 ? `<button class="cell link" data-act="all">${S.showAll ? "Свернуть" : `Показать все ${rows.length} ${plural(rows.length, PAY_WORDS)}`}</button>` : "") + `</div>`;
    }
  } else {
    h += `<div class="group-title">План</div><div class="group">
      <div class="cell insight">У цели нет срока, поэтому графика платежей нет.</div>
      <button class="cell link" data-act="edit">Добавить срок и рассчитать план</button></div>`;
  }
  h += `<div class="group-title">Что если</div><div class="group">
    <label class="cell"><span class="grow">Вносить ${PER[g.freq]}</span><input class="right num" id="wi" inputmode="decimal" autocomplete="off" placeholder="${planPay ? planPay / 100 : 5000}" style="flex:none;width:110px"><span class="val">₽</span></label>
    <div class="cell insight sub" id="wiOut" style="margin:0">Введите сумму, и копилка покажет, когда вы накопите.</div></div>`;
  return h;
}

// Вкладка «История»
function historyTab(g) {
  if (!g.ops.length) return `<div class="group"><div class="cell sub" style="margin:0">Операций пока нет. Пополнить цель можно на вкладке «Обзор».</div></div>`;
  let h = `<div class="group">` + g.ops.slice().reverse().map(([a, t]) => `<div class="cell"><span class="grow sub" style="margin:0">${dTime(new Date(t))}</span>
      <span class="num ${a > 0 ? "ok" : "bad"}">${a > 0 ? "+" : "−"}${money(Math.abs(a))}</span></div>`).join("") + `</div>`;
  if (g.ops.length >= MAX_OPS) h += `<p class="group-foot">Показаны последние ${MAX_OPS} операций.</p>`;
  return h;
}

function formValues() {

function updatePreview() {
  const el = document.getElementById("preview");
  if (!el) return;
  const f = S.form, { target, rate } = formValues();
  const bal = f.id ? S.goals[f.id].balance : 0;
  if (!target) { el.innerHTML = `<span class="sub" style="margin:0">Введите сумму цели, чтобы увидеть расчёт.</span>`; return; }
  if (!(rate >= 0 && rate <= 100)) { el.innerHTML = `<span class="bad">Ставка должна быть от 0 до 100%.</span>`; return; }
  const tmp = { balance: bal, target, deadline: f.has ? f.deadline : null, freq: f.freq, rate };
  if (target <= bal) { el.innerHTML = `<b class="ok">Уже накоплено</b>`; return; }
  if (!f.has) { el.innerHTML = `<span class="sub" style="margin:0">Без срока копилка не строит график, но покажет прогноз по вашему темпу пополнений.</span>`; return; }
  if (!f.deadline || parseDate(f.deadline) <= today0()) { el.innerHTML = `<span class="bad">Выберите дату позже сегодняшней.</span>`; return; }
  const n = paymentsLeft(tmp), p = needPayment(bal, target, n, perRate(tmp));

    ? `<b class="num">${money(p)} ${PER[f.freq]}</b>${n} ${plural(n, PAY_WORDS)} до ${dLong(parseDate(f.deadline))}${rate ? ", с учётом процентов" : ""}`
    : `<b class="ok">Вносить не нужно</b>Проценты сами доведут сумму до цели к сроку.`;
}
async function saveForm() {
  const f = S.form, err = document.getElementById("ferr"), { target, rate } = formValues();
  const name = f.name.trim();
  if (!name) { err.textContent = "Введите название цели."; return; }
  if (!target) { err.textContent = "Введите сумму цели числом, например 80000."; return; }
  if (!(rate >= 0 && rate <= 100)) { err.textContent = "Ставка должна быть от 0 до 100%."; return; }
  if (f.has && (!f.deadline || parseDate(f.deadline) <= today0())) { err.textContent = "Выберите дату позже сегодняшней."; return; }
  let id = f.id, g;
  if (!id) {
    if (S.ids.length >= 100) { err.textContent = "Можно создать не больше 100 целей."; return; }
    id = Date.now().toString(36);
    g = norm({ balance: 0 });
  } else g = S.goals[id];
  const before = f.id ? JSON.stringify(g) : null;
  const old = JSON.stringify([g.target, g.deadline, g.freq, g.rate]), oldFreq = g.freq;
  Object.assign(g, { emoji: f.emoji, name, target, deadline: f.has ? f.deadline : null, freq: f.freq, rate });
  if (!f.id || old !== JSON.stringify([g.target, g.deadline, g.freq, g.rate])) makePlan(g);
  if (f.id && oldFreq !== g.freq) rebuildStreak(g);   // серия считается в других периодах
  checkAch(g);
  S.goals[id] = g;
  if (!f.id) S.ids.push(id);
  try { await saveGoal(id); if (!f.id) await saveIds(); }
  catch (e) {
    // возвращаем всё как было, чтобы на экране не осталось того, чего нет в облаке
    if (!f.id) { delete S.goals[id]; S.ids = S.ids.filter(x => x !== id); } else S.goals[id] = norm(JSON.parse(before));
    err.textContent = "Не удалось сохранить. Проверьте интернет и попробуйте ещё раз."; return;
  }
  haptic("success");
  if (f.id) { S.stack.pop(); showTop(true); }
  else { S.stack = []; push("detail", id); }   // новая цель всегда открывается на «Обзоре»
}

/* ----- Операции ----- */
async function operate(sign) {
  const id = S.stack[S.stack.length - 1].id, g = S.goals[id], err = document.getElementById("err");
  const a = parseAmount(document.getElementById("amt").value);
  if (!a) { err.textContent = "Введите сумму больше нуля."; return; }
  if (sign < 0 && a > g.balance) { err.textContent = "Можно снять не больше " + money(g.balance) + "."; return; }
  const backup = JSON.stringify(g);
  g.balance += sign * a;
  g.ops.push([sign * a, Date.now()]);
  if (g.ops.length > MAX_OPS) g.ops = g.ops.slice(-MAX_OPS);
  if (sign > 0) addToStreak(g, Date.now());
  const fresh = checkAch(g);
  try { await saveGoal(id); }
  catch (e) { S.goals[id] = norm(JSON.parse(backup)); err.textContent = "Не удалось сохранить. Проверьте интернет."; return; }
  S.undo = { id, before: backup };
  showTop(false);
  if (fresh.length) {
    const top = fresh[fresh.length - 1];   // показываем самое крупное новое достижение
    haptic("success");
    toast(top.e, top.t(g), fresh.length > 1 ? `и ещё ${fresh.length - 1}: загляните в «Достижения»` : top.s);
  } else haptic("tap");
  snack(`${sign > 0 ? "Пополнено" : "Снято"}: ${money(a)}`, { act: "undo", label: "Отменить" });
}

// Возвращает цель в состояние до последней операции
async function undoLast() {
  const u = S.undo;
  if (!u || !S.goals[u.id]) return;
  const now = JSON.stringify(S.goals[u.id]);
  S.goals[u.id] = norm(JSON.parse(u.before));
  try { await saveGoal(u.id); }
  catch (e) { S.goals[u.id] = norm(JSON.parse(now)); snack("Не удалось отменить. Проверьте интернет."); return; }
  S.undo = null;
  haptic("tap");
  const top = S.stack[S.stack.length - 1];
  if (top && top.kind === "detail") showTop(false); else renderMain();
  snack("Операция отменена");
}

/* ================== Обработка нажатий ================== */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, top = S.stack[S.stack.length - 1];
  switch (act) {
    case "view": S.view = t.dataset.v; haptic("tap"); renderMain(); window.scrollTo(0, 0); break;
    case "open": push("detail", t.dataset.id); break;
    case "new": openForm(null); break;
    case "newBill": openBillForm(null); break;
    case "editBill": openBillForm(t.dataset.id); break;
    case "pay": once(() => togglePaid(t.dataset.id)); break;
    case "bemoji": S.bform.emoji = t.dataset.v; selectIn(t); haptic("tap"); break;
    case "bday": {
      const d = S.bform.day = Number(t.dataset.v);
      selectIn(t);
      document.getElementById("dayTitle").textContent = dayTitle(d);
      document.getElementById("dayFoot").textContent = dayFoot(d);
      haptic("tap"); break;
    }
    case "saveBill": once(saveBillForm); break;
    case "delBill": once(async () => {
      const b = BL.items[S.bform.id];
      if (!(await confirmMsg(`Удалить трату «${b.name}»?`))) return;
      BL.ids = BL.ids.filter(x => x !== b.id);
      try { await saveBillIds(); }
      catch (er) { BL.ids.push(b.id); alertMsg("Не удалось удалить. Проверьте интернет."); return; }
      delete BL.items[b.id];
      store.remove("b_" + b.id).catch(() => {});
      haptic("warning"); S.stack = []; showTop();
    }); break;
    case "close": S.stack = []; showTop(); break;
    case "back": back(); break;
    case "edit": openForm(top.id); break;
    case "tab": S.tab = t.dataset.v; haptic("tap"); showTop(false); break;
    case "toPlan": S.tab = "plan"; showTop(true); break;
    case "undo": hideSnack(); once(undoLast); break;
    case "chip": document.getElementById("amt").value = t.dataset.v; haptic("tap"); break;
    case "dep": once(() => operate(1)); break;
    case "wd": once(() => operate(-1)); break;
    case "all": S.showAll = !S.showAll; showTop(false); break;
    case "emoji": S.form.emoji = t.dataset.v; selectIn(t); haptic("tap"); break;
    case "freq": S.form.freq = t.dataset.v; selectIn(t); updatePreview(); haptic("tap"); break;
    case "save": once(saveForm); break;
    case "retry": load(); break;
    case "del": once(async () => {
      top.id = S.form.id;                 // удаляем из формы изменения: id берём у формы
      const g = S.goals[top.id];
      if (!(await confirmMsg(`Удалить цель «${g.name}» и всю её историю?`))) return;
      S.ids = S.ids.filter(x => x !== top.id);
      try { await saveIds(); }
      catch (er) { S.ids.push(top.id); alertMsg("Не удалось удалить. Проверьте интернет."); return; }
      delete S.goals[top.id];
      if (S.undo && S.undo.id === top.id) S.undo = null;
      store.remove("g_" + top.id).catch(() => {});
      haptic("warning"); S.stack = []; showTop();
    }); break;
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bf && S.bform) { S.bform[el.dataset.bf] = el.value; return; }
  if (el.dataset.f && S.form) {
    if (el.type === "checkbox") return;
    S.form[el.dataset.f] = el.value;
    updatePreview();
  }
  if (el.id === "wi") {
    const top = S.stack[S.stack.length - 1], g = S.goals[top.id], out = document.getElementById("wiOut");
    const P = parseAmount(el.value);
    if (!P) { out.textContent = "Введите сумму, и копилка покажет, когда вы накопите."; return; }
    const n = periodsToFinish(g.balance, g.target, P, perRate(g));
    if (n > 1200) { out.textContent = "С такой суммой копить придётся слишком долго. Попробуйте больше."; return; }
    const date = addPeriod(today0(), n, g.freq);
    let txt = `Накопите к ${dLong(date)}, через ${n} ${plural(n, UNIT[g.freq])}.`;
    if (g.deadline) { const dl = parseDate(g.deadline); txt += date <= dl ? " Успеваете к сроку." : " Это позже срока."; }
    out.textContent = txt;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f === "has" && S.form) { S.form.has = el.checked; haptic("tap"); showTop(false); }
  if (el.dataset.f === "deadline" && S.form) { S.form.deadline = el.value; updatePreview(); }
});

load();
</script>
